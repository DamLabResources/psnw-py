[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psnw-py"
version = "0.1.0"
description = "Position-specific Needleman-Wunsch in Python + numba, with reference-anchored MSA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Dampier", email = "wnd22@drexel.edu" }]
keywords = ["alignment", "needleman-wunsch", "position-specific", "bioinformatics", "MSA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
numba = ["numba>=0.56"]
dev = ["pytest", "pytest-cov", "numba>=0.56", "build", "twine"]
docs = ["sphinx>=7", "myst-parser", "sphinx-autodoc-typehints", "roman>=3"]

[project.urls]
Homepage = "https://github.com/DamLabResources/psnw-py"
Documentation = "https://psnw-py.readthedocs.io"
Repository = "https://github.com/DamLabResources/psnw-py"
Changelog = "https://github.com/DamLabResources/psnw-py/blob/master/CHANGELOG.md"

[project.scripts]
psnw-py = "psnw_py.cli:main"

[tool.setuptools.packages.find]
include = ["psnw_py", "psnw_py.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["psnw_py"]
branch = false

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
]
